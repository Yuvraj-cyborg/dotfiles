include hyde.conf

# Minimal Tab bar styling 
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}


# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no
#
#window_border_width 3
#window_margin_width 10
#round_corners yes


# BEGIN_KITTY_THEME
# Adwaita darker
include current-theme.conf
# END_KITTY_THEME

# Force the macOS titlebar (close/minimize/fullscreen bar) to be pure black.
# Placed after all includes so it overrides the theme's `system` setting.
# macos_titlebar_color #000000

# Hide the macOS window titlebar (top bar) and square off the corners.
# Overrides hyde.conf's `hide_window_decorations no`.
hide_window_decorations titlebar-and-corners

# Padding: top right bottom left. Extra room up top (no titlebar anymore) and
# enough at the bottom so nvim's statusline / last row isn't clipped.
# Overrides hyde.conf's uniform `window_padding_width 25`.
window_padding_width 34 24 28 24

# --- Window sizing ---
# Reopen at the last-used window size, so once you maximize it stays maximized
# across launches. (This is kitty's default; set explicitly to document intent.)
remember_window_size yes

# Maximize to fit the visible screen (fixes the window hanging below the
# screen edge after removing the titlebar). Press to snap-fit, press again
# to restore. Different from ctrl+cmd+f, which is true (separate-space) fullscreen.
map cmd+shift+f toggle_maximized

# Shrink the window to a small, compact size. Press cmd+shift+f to re-maximize.
map cmd+shift+s remote_control resize-os-window --self --unit cells --width 80 --height 24

# --- Tabs ---
map cmd+t        new_tab_with_cwd
map cmd+w        close_tab
map cmd+shift+]  next_tab
map cmd+shift+[  previous_tab